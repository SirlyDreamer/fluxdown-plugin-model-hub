name: 问题反馈
description: 解析、文件清单、镜像或下载出现异常
body:
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: FluxDown 版本、插件版本、操作系统
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供公开示例链接及步骤，不要提供 Token、Cookie 或私有仓库地址。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: 镜像与代理
      description: 是否使用镜像、手动代理或 TUN/fake-IP？不要提供代理密码。
  - type: textarea
    id: error
    attributes:
      label: 脱敏错误信息
      description: 请移除凭据、个人路径及私有数据。
      render: text
